config:
  target: "http://host.docker.internal:5000"
  phases:
    - duration: 15
      arrivalRate: 20
      rampTo: 80
      name: "Ramp-up: 20 -> 80 users/sec"
    - duration: 20
      arrivalRate: 80
      name: "Sustained Throughput: 80 users/sec"
  http:
    timeout: 30
scenarios:
  - name: "Fintech API End-to-End Suite"
    flow:
      - get:
          url: "/api/trades?limit=200"
      - get:
          url: "/api/metrics"
      - get:
          url: "/metrics"
      - get:
          url: "/api/ping"
