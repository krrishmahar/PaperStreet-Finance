name: fintech-bse

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintech-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech_bse
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fintech_bse" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  pgbouncer:
    image: edoboor/pgbouncer:latest
    container_name: fintech-pgbouncer
    restart: unless-stopped
    ports:
      - "6543:5432"
    environment:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fintech_bse
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: md5
      ADMIN_USERS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: fintech-redis
    restart: unless-stopped
    mem_limit: 1024m
    command: [ "redis-server", "--maxmemory", "1024mb", "--maxmemory-policy", "noeviction" ]
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fintech-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: fintech-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  playwright-mcp:
    image: mcr.microsoft.com/playwright:v1.42.0-jammy
    container_name: playwright-mcp
    restart: unless-stopped
    command: >
      npx -y @playwright/mcp@latest --port 3000 --host 0.0.0.0
    init: true
    ipc: host
    security_opt:
      - seccomp=unconfined
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3000'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  serena-mcp:
    image: ghcr.io/oraios/serena:latest
    container_name: serena-mcp
    restart: unless-stopped
    volumes:
      - .:/workspaces/projects
    ports:
      - "8000:8000"
    command: >
      serena start-mcp-server --transport sse --host 0.0.0.0 --port 8000 --project /workspaces/projects --open-web-dashboard false
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  artillery:
    image: artilleryio/artillery:latest
    container_name: fintech-artillery
    restart: unless-stopped
    entrypoint: [ "tail", "-f", "/dev/null" ]
    volumes:
      - ./load-tests:/scripts

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:
